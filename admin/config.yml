backend:
  name: git-gateway
  branch: main

media_folder: "assets/uploads"
public_folder: "/assets/uploads"

collections:
  - name: "articulos"
    label: "Artículos y Noticias"
    folder: "content/articulos"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Subtítulo / Extracto", name: "excerpt", widget: "text" }
      - { label: "Autor", name: "author", widget: "string", default: "Redacción El Oráculo" }
      - { label: "Categoría", name: "category", widget: "select", options: ["Opinión", "Cultura", "Historia", "Actualidad"] }
      - { label: "Fecha de Publicación", name: "date", widget: "datetime" }
      - { label: "Imagen Destacada", name: "image", widget: "image", required: false }
      - { label: "Contenido de la Noticia", name: "body", widget: "markdown" }