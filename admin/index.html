<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Editorial - A CONTRALUZ</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* Estilos del Modal de Vista Previa */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 85vh;
            overflow-y: auto;
            border-top: 5px solid #c00;
        }

        /* Botón de Cierre (X) */
        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            line-height: 1;
            padding: 5px;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #c00;
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>A CONTRALUZ</h1>
        <p>PANEL DE CONTROL EDITORIAL</p>
    </header>

    <div class="status-bar">
        <span>ESTADO: SESIÓN ACTIVA</span>
        <button class="btn-logout" id="logout-btn">CERRAR SESIÓN</button>
    </div>

    <div class="container">
        <!-- Formulario de Redacción -->
        <section class="panel">
            <h2>Redactar Noticia</h2>
            <form id="news-form">
                <div class="form-group">
                    <label for="fecha">FECHA DE PUBLICACIÓN</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="seccion">SECCIÓN</label>
                    <select id="seccion" name="seccion" required>
                        <option value="Hoy">Hoy</option>
                        <option value="Opinión">Opinión</option>
                        <option value="Investigación">Investigación</option>
                        <option value="Cultura">Cultura</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="titulo">TÍTULO</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Titular de la noticia..." required>
                </div>

                <div class="form-group">
                    <label for="resumen">RESUMEN / ENTRADILLA</label>
                    <input type="text" id="resumen" name="resumen" placeholder="Entradilla breve..." required>
                </div>

                <div class="form-group">
                    <label for="imagen">URL DE LA IMAGEN</label>
                    <input type="url" id="imagen" name="imagen" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="cuerpo">CUERPO DE LA NOTICIA</label>
                    <textarea id="cuerpo" name="cuerpo" rows="8" placeholder="Escribe el artículo aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">PUBLICAR ARTÍCULO</button>
            </form>
        </section>

        <!-- Histórico de Artículos -->
        <section class="panel">
            <h2>Histórico de Artículos</h2>
            <div id="articles-list">
                <!-- Se puebla dinámicamente mediante JS -->
            </div>
        </section>
    </div>

    <!-- Modal de Vista Previa -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button type="button" class="close-btn" id="modal-close-btn">&times;</button>
            <div id="modal-body">
                <!-- Contenido de vista previa llenado dinámicamente por script.js -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
    <script>
        // Lógica para cerrar el modal de vista previa de forma segura
        const modal = document.getElementById('preview-modal');
        const closeBtn = document.getElementById('modal-close-btn');

        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });
        }

        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
