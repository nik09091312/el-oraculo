<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel de Administración | El Oráculo</title>
  <style>
    * { box-sizing: border-box; font-family: system-ui, -apple-system, sans-serif; }
    body { background-color: #0f172a; color: #f8fafc; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; }
    .card { background: #1e293b; border-radius: 12px; padding: 32px; width: 100%; max-width: 420px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); }
    h1 { font-size: 1.5rem; margin-top: 0; color: #38bdf8; text-align: center; }
    p.sub { font-size: 0.9rem; color: #94a3b8; text-align: center; margin-bottom: 24px; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; margin-bottom: 6px; color: #cbd5e1; }
    input, textarea { width: 100%; padding: 10px 12px; background: #0f172a; border: 1px solid #334155; border-radius: 6px; color: #fff; font-size: 0.95rem; }
    input:focus, textarea:focus { border-color: #38bdf8; outline: none; }
    button { width: 100%; padding: 12px; background: #0284c7; color: #fff; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; transition: background 0.2s; margin-top: 8px; }
    button:hover { background: #0369a1; }
    .hidden { display: none; }
    .article-form { max-width: 700px; }
    .alert { padding: 10px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 16px; text-align: center; }
    .alert-error { background: #7f1d1d; color: #fca5a5; }
    .alert-success { background: #14532d; color: #86efac; }
  </style>
</head>
<body>

  <!-- FORMULARIO DE ACCESO -->
  <div id="login-card" class="card">
    <h1>El Oráculo</h1>
    <p class="sub">Acceso al Panel de Administración</p>
    <div id="login-error" class="alert alert-error hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <input type="email" id="email" value="periodismoeloraculo@gmail.com" required />
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <button type="submit">Ingresar al panel</button>
    </form>
  </div>

  <!-- EDITOR DE ARTÍCULOS -->
  <div id="editor-card" class="card article-form hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <h1 style="margin: 0;">Crear Artículo</h1>
      <button id="logout-btn" style="width: auto; padding: 6px 12px; background: #475569; margin: 0;">Cerrar sesión</button>
    </div>
    <div id="editor-msg" class="alert hidden"></div>
    <form id="article-form">
      <div class="field">
        <label for="title">Título del artículo</label>
        <input type="text" id="title" required placeholder="Escribe el título aquí..." />
      </div>
      <div class="field">
        <label for="summary">Resumen / Copete</label>
        <textarea id="summary" rows="2" required placeholder="Breve introducción de la noticia..."></textarea>
      </div>
      <div class="field">
        <label for="image">URL de la imagen destacada</label>
        <input type="url" id="image" placeholder="https://ejemplo.com/imagen.jpg" />
      </div>
      <div class="field">
        <label for="body">Cuerpo de la noticia</label>
        <textarea id="body" rows="8" required placeholder="Escribe el contenido del artículo..."></textarea>
      </div>
      <button type="submit">Publicar Noticia</button>
    </form>
  </div>

  <script>
    // CONTRASEÑA AUTORIZADA
    const CLAVE_CORRECTA = "Oraculo2026*";

    const loginCard = document.getElementById('login-card');
    const editorCard = document.getElementById('editor-card');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    if (localStorage.getItem('oraculo_logged_in') === 'true') {
      showEditor();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('password').value.trim();

      if (pass === CLAVE_CORRECTA) {
        localStorage.setItem('oraculo_logged_in', 'true');
        loginError.classList.add('hidden');
        showEditor();
      } else {
        loginError.textContent = "Contraseña incorrecta. Recuerda incluir el asterisco (*).";
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.removeItem('oraculo_logged_in');
      editorCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    function showEditor() {
      loginCard.classList.add('hidden');
      editorCard.classList.remove('hidden');
    }

    document.getElementById('article-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const msg = document.getElementById('editor-msg');
      msg.className = "alert alert-success";
      msg.textContent = "¡Noticia lista y publicada correctamente!";
      msg.classList.remove('hidden');

      document.getElementById('article-form').reset();
      setTimeout(() => msg.classList.add('hidden'), 4000);
    });
  </script>
</body>
</html>
