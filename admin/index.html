<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Panel Editorial | A Contraluz</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #f4f4f4; color: #111111; font-family: system-ui, -apple-system, sans-serif; margin: 0; padding: 20px; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .brand-header { text-align: center; margin-bottom: 25px; }
    .brand-header h1 { font-family: 'Times New Roman', serif; font-size: 2.2rem; font-weight: 900; margin: 0; letter-spacing: 2px; text-transform: uppercase; color: #000; }
    .brand-header p { color: #cc0000; font-weight: bold; font-size: 0.85rem; text-transform: uppercase; margin-top: 4px; letter-spacing: 1px; }
    .card { background: #ffffff; border-top: 4px solid #cc0000; border-left: 1px solid #ddd; border-right: 1px solid #ddd; border-bottom: 1px solid #ddd; padding: 30px; width: 100%; max-width: 950px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
    h2 { font-family: 'Georgia', serif; color: #000000; margin-top: 0; border-bottom: 2px solid #111; padding-bottom: 6px; font-size: 1.3rem; }
    .field { margin-bottom: 16px; }
    label { display: block; font-size: 0.85rem; font-weight: bold; margin-bottom: 6px; color: #333333; text-transform: uppercase; }
    input, textarea, select { width: 100%; padding: 10px 12px; background: #ffffff; border: 1px solid #cccccc; border-radius: 2px; color: #111; font-size: 0.95rem; }
    input:focus, textarea:focus, select:focus { border-color: #cc0000; outline: none; }
    button { padding: 10px 16px; background: #000000; color: #ffffff; border: none; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.2s; font-size: 0.8rem; letter-spacing: 1px; }
    button:hover { background: #cc0000; }
    .btn-danger { background: #cc0000; }
    .btn-danger:hover { background: #990000; }
    .btn-secondary { background: #555; }
    .btn-secondary:hover { background: #333; }
    .hidden { display: none !important; }
    .alert { padding: 12px; border-radius: 2px; font-size: 0.85rem; margin-bottom: 20px; text-align: center; font-weight: bold; }
    .alert-error { background: #fde8e8; color: #990000; border: 1px solid #f8b4b4; }
    .alert-success { background: #edf8f1; color: #0e6231; border: 1px solid #b6e5c8; }
    .grid { display: grid; grid-template-columns: 1.2fr 0.8fr; gap: 30px; }
    @media (max-width: 768px) { .grid { grid-template-columns: 1fr; } }
    .article-item { background: #fafafa; padding: 12px; border: 1px solid #e0e0e0; margin-bottom: 10px; }
    .article-actions { display: flex; gap: 6px; margin-top: 8px; }

    /* MODAL DE VISTA PREVIA */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
    .modal-content { background: #fff; max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 25px; position: relative; border-top: 5px solid #cc0000; }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; background: none; border: none; cursor: pointer; font-weight: bold; }
  </style>
</head>
<body>

  <div class="brand-header">
    <h1>A CONTRALUZ</h1>
    <p>Panel de Control Editorial</p>
  </div>

  <!-- LOGIN -->
  <div id="login-card" class="card" style="max-width: 420px;">
    <h2>Ingreso Redacción</h2>
    <div id="login-error" class="alert alert-error hidden"></div>
    <form id="login-form">
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required />
      </div>
      <div class="field">
        <label for="github-token">GitHub Token (Classic)</label>
        <input type="password" id="github-token" placeholder="ghp_..." required />
      </div>
      <button type="submit" style="width: 100%;">Acceder al Editor</button>
    </form>
  </div>

  <!-- PANEL -->
  <div id="editor-card" class="card hidden">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
      <span style="font-weight: bold; text-transform: uppercase; font-size: 0.9rem;">Estado: Sesión Activa</span>
      <button id="logout-btn" class="btn-danger" style="padding: 6px 12px; font-size: 0.75rem;">Cerrar sesión</button>
    </div>

    <div id="editor-msg" class="alert hidden"></div>

    <div class="grid">
      <div>
        <h2 id="form-title">Redactar Noticia</h2>
        <form id="article-form">
          <input type="hidden" id="edit-filename" value="" />
          <input type="hidden" id="edit-sha" value="" />

          <div class="field">
            <label for="pub-date">Fecha de Publicación</label>
            <input type="date" id="pub-date" required />
          </div>

          <div class="field">
            <label for="category">Sección</label>
            <select id="category" required>
              <option value="hoy">Hoy</option>
              <option value="opinion">Opiniones</option>
              <option value="cultura">Cultura</option>
              <option value="deportes">Deportes</option>
            </select>
          </div>

          <div class="field">
            <label for="title">Título</label>
            <input type="text" id="title" required placeholder="Titular de la noticia..." />
          </div>

          <div class="field">
            <label for="summary">Resumen / Copete</label>
            <textarea id="summary" rows="2" required placeholder="Entradilla breve..."></textarea>
          </div>

          <div class="field">
            <label for="image">URL de la imagen</label>
            <input type="url" id="image" placeholder="https://..." />
          </div>

          <div class="field">
            <label for="body">Cuerpo de la noticia</label>
            <textarea id="body" rows="7" required placeholder="Escribe el artículo aquí..."></textarea>
          </div>

          <div style="display: flex; gap: 10px;">
            <button type="submit" id="submit-btn" style="flex: 1;">Publicar Artículo</button>
            <button type="button" id="cancel-edit-btn" class="btn-secondary hidden">Cancelar</button>
          </div>
        </form>
      </div>

      <div>
        <h2>Histórico de Artículos</h2>
        <div id="articles-list">Cargando publicaciones...</div>
      </div>
    </div>
  </div>

  <!-- MODAL VISTA PREVIA -->
  <div id="preview-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closePreview()">&times;</button>
      <div id="preview-body"></div>
    </div>
  </div>

  <script>
    const REPO_OWNER = "nik09091312";
    const REPO_NAME = "el-oraculo";
    const CLAVE_CORRECTA = "Oraculo2026*";

    const loginCard = document.getElementById('login-card');
    const editorCard = document.getElementById('editor-card');
    const loginForm = document.getElementById('login-form');
    const loginError = document.getElementById('login-error');
    const logoutBtn = document.getElementById('logout-btn');

    // Inicializar fecha de hoy por defecto
    document.getElementById('pub-date').value = new Date().toISOString().split('T')[0];

    if (localStorage.getItem('oraculo_logged') === 'true') {
      showEditor();
    }

    loginForm.addEventListener('submit', (e) => {
      e.preventDefault();
      const pass = document.getElementById('password').value.trim();
      const token = document.getElementById('github-token').value.trim();

      if (pass === CLAVE_CORRECTA) {
        localStorage.setItem('oraculo_logged', 'true');
        localStorage.setItem('gh_token', token);
        showEditor();
      } else {
        loginError.textContent = "Contraseña incorrecta.";
        loginError.classList.remove('hidden');
      }
    });

    logoutBtn.addEventListener('click', () => {
      localStorage.clear();
      editorCard.classList.add('hidden');
      loginCard.classList.remove('hidden');
    });

    function showEditor() {
      loginCard.classList.add('hidden');
      editorCard.classList.remove('hidden');
      loadPublishedArticles();
    }

    document.getElementById('article-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const token = localStorage.getItem('gh_token');
      const title = document.getElementById('title').value;
      const category = document.getElementById('category').value;
      const summary = document.getElementById('summary').value;
      const image = document.getElementById('image').value;
      const body = document.getElementById('body').value;
      const pubDate = document.getElementById('pub-date').value;

      const editFilename = document.getElementById('edit-filename').value;
      const editSha = document.getElementById('edit-sha').value;

      const slug = title.toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/(^-|-$)+/g, '');
      const filename = editFilename ? editFilename : `articulos/${slug}.md`;

      const content = `---
title: "${title}"
date: "${pubDate}"
category: "${category}"
summary: "${summary}"
image: "${image}"
---

${body}`;

      const msg = document.getElementById('editor-msg');
      msg.className = "alert alert-success";
      msg.textContent = "Guardando en GitHub...";
      msg.classList.remove('hidden');

      const payload = {
        message: editFilename ? `Editar noticia: ${title}` : `Agregar noticia: ${title}`,
        content: btoa(unescape(encodeURIComponent(content)))
      };

      if (editSha) payload.sha = editSha;

      try {
        const response = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${filename}`, {
          method: 'PUT',
          headers: {
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json',
            'Content-Type': 'application/json'
          },
          body: JSON.stringify(payload)
        });

        if (response.ok) {
          msg.textContent = "¡Artículo guardado correctamente!";
          resetForm();
          loadPublishedArticles();
        } else {
          const resData = await response.json();
          throw new Error(`Código ${response.status}: ${resData.message}`);
        }
      } catch (err) {
        msg.className = "alert alert-error";
        msg.textContent = `Error: ${err.message}`;
      }
    });

    async function loadPublishedArticles() {
      const container = document.getElementById('articles-list');
      const token = localStorage.getItem('gh_token');

      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/articulos`, {
          headers: { 
            'Authorization': `Bearer ${token}`,
            'Accept': 'application/vnd.github.v3+json'
          }
        });
        
        if (!res.ok) {
          container.innerHTML = "<p style='color:#666;'>No hay noticias en la carpeta /articulos.</p>";
          return;
        }

        const files = await res.json();
        container.innerHTML = "";

        files.filter(f => f.name.endsWith('.md')).forEach(file => {
          const item = document.createElement('div');
          item.className = 'article-item';
          item.innerHTML = `
            <div style="font-weight:bold; font-size:0.85rem;">${file.name}</div>
            <div class="article-actions">
              <button class="btn-secondary" style="padding:4px 8px; font-size:0.75rem;" onclick="viewArticle('${file.download_url}')">Ver</button>
              <button style="padding:4px 8px; font-size:0.75rem;" onclick="editArticle('${file.path}', '${file.sha}', '${file.download_url}')">Editar</button>
              <button class="btn-danger" style="padding:4px 8px; font-size:0.75rem;" onclick="deleteArticle('${file.path}', '${file.sha}')">Eliminar</button>
            </div>
          `;
          container.appendChild(item);
        });
      } catch (e) {
        container.innerHTML = "<p style='color:#cc0000;'>Error al cargar el histórico.</p>";
      }
    }

    async function viewArticle(downloadUrl) {
      const res = await fetch(downloadUrl);
      const text = await res.text();
      const parsed = parseMarkdown(text);

      document.getElementById('preview-body').innerHTML = `
        <span style="color:#cc0000; font-weight:bold; text-transform:uppercase; font-size:0.8rem;">${parsed.category || ''}</span>
        <h2 style="margin:10px 0;">${parsed.title || 'Sin título'}</h2>
        <p style="font-size:0.8rem; color:#666;">Fecha: ${parsed.date || 'Sin fecha'}</p>
        ${parsed.image ? `<img src="${parsed.image}" style="width:100%; max-height:250px; object-fit:cover; margin:10px 0;">` : ''}
        <p><strong>Resumen:</strong> ${parsed.summary || ''}</p>
        <hr style="margin:15px 0;">
        <div style="white-space:pre-line;">${parsed.body || ''}</div>
      `;
      document.getElementById('preview-modal').classList.remove('hidden');
    }

    function closePreview() {
      document.getElementById('preview-modal').classList.add('hidden');
    }

    async function editArticle(path, sha, downloadUrl) {
      const res = await fetch(downloadUrl);
      const text = await res.text();
      const parsed = parseMarkdown(text);

      document.getElementById('form-title').textContent = "Editar Noticia";
      document.getElementById('edit-filename').value = path;
      document.getElementById('edit-sha').value = sha;

      document.getElementById('title').value = parsed.title || '';
      document.getElementById('category').value = (parsed.category || 'hoy').toLowerCase();
      document.getElementById('summary').value = parsed.summary || '';
      document.getElementById('image').value = parsed.image || '';
      document.getElementById('body').value = parsed.body || '';
      if (parsed.date) document.getElementById('pub-date').value = parsed.date;

      document.getElementById('submit-btn').textContent = "Guardar Cambios";
      document.getElementById('cancel-edit-btn').classList.remove('hidden');

      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    document.getElementById('cancel-edit-btn').addEventListener('click', resetForm);

    function resetForm() {
      document.getElementById('article-form').reset();
      document.getElementById('form-title').textContent = "Redactar Noticia";
      document.getElementById('edit-filename').value = "";
      document.getElementById('edit-sha').value = "";
      document.getElementById('submit-btn').textContent = "Publicar Artículo";
      document.getElementById('cancel-edit-btn').classList.add('hidden');
      document.getElementById('pub-date').value = new Date().toISOString().split('T')[0];
    }

    function parseMarkdown(text) {
      const frontMatterMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!frontMatterMatch) return { title: '', body: text };

      const yaml = frontMatterMatch[1];
      const body = frontMatterMatch[2];
      const metadata = {};

      yaml.split('\n').forEach(line => {
        const [key, ...value] = line.split(':');
        if (key && value) {
          metadata[key.trim()] = value.join(':').trim().replace(/^"|"$/g, '');
        }
      });

      return { ...metadata, body };
    }

    async function deleteArticle(path, sha) {
      if (!confirm("¿Deseas eliminar definitivamente esta noticia?")) return;
      const token = localStorage.getItem('gh_token');

      const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/${path}`, {
        method: 'DELETE',
        headers: {
          'Authorization': `Bearer ${token}`,
          'Accept': 'application/vnd.github.v3+json',
          'Content-Type': 'application/json'
        },
        body: JSON.stringify({
          message: `Eliminar noticia ${path}`,
          sha: sha
        })
      });

      if (res.ok) {
        loadPublishedArticles();
      } else {
        alert("No se pudo eliminar el artículo.");
      }
    }
  </script>
</body>
</html>
