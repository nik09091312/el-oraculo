<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control Editorial - A CONTRALUZ</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Georgia', serif;
        }

        body {
            background-color: #f4f4f4;
            color: #111;
            padding: 20px;
        }

        .header {
            text-align: center;
            padding: 20px 0;
            border-bottom: 3px double #000;
            margin-bottom: 20px;
        }

        .header h1 {
            font-size: 2.5rem;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .header p {
            font-size: 0.9rem;
            color: #a00;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #fff;
            padding: 10px 20px;
            border: 1px solid #ccc;
            margin-bottom: 20px;
            font-size: 0.85rem;
            font-weight: bold;
        }

        .btn-logout {
            background: #a00;
            color: #fff;
            border: none;
            padding: 6px 12px;
            cursor: pointer;
            font-size: 0.8rem;
            text-transform: uppercase;
            font-weight: bold;
        }

        .container {
            display: grid;
            grid-template-columns: 2fr 1fr;
            gap: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        .panel {
            background: #fff;
            padding: 20px;
            border: 1px solid #ccc;
        }

        .panel h2 {
            font-size: 1.4rem;
            border-bottom: 2px solid #000;
            padding-bottom: 5px;
            margin-bottom: 15px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.8rem;
            font-weight: bold;
            text-transform: uppercase;
            margin-bottom: 5px;
        }

        .form-group input, 
        .form-group select, 
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            font-family: inherit;
            font-size: 0.95rem;
        }

        .form-group textarea {
            resize: vertical;
        }

        .btn-submit {
            width: 100%;
            background: #000;
            color: #fff;
            padding: 12px;
            border: none;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .btn-submit:hover {
            background: #333;
        }

        .article-item {
            background: #fafafa;
            border: 1px solid #e0e0e0;
            padding: 15px;
            margin-bottom: 15px;
        }

        .article-item h3 {
            font-size: 1rem;
            margin-bottom: 10px;
        }

        .article-actions {
            display: flex;
            gap: 5px;
        }

        .btn-action {
            padding: 5px 10px;
            border: none;
            color: #fff;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
        }

        .btn-ver { background: #555; }
        .btn-editar { background: #000; }
        .btn-eliminar { background: #c00; }

        /* Estilos del Modal de Vista Previa */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background: rgba(0, 0, 0, 0.6);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        .modal-content {
            background: #fff;
            width: 90%;
            max-width: 650px;
            padding: 30px;
            position: relative;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
            max-height: 85vh;
            overflow-y: auto;
            border-top: 5px solid #c00;
        }

        .close-btn {
            position: absolute;
            top: 10px;
            right: 15px;
            background: transparent;
            border: none;
            font-size: 28px;
            font-weight: bold;
            color: #333;
            cursor: pointer;
            line-height: 1;
            padding: 5px;
            transition: color 0.2s ease;
        }

        .close-btn:hover {
            color: #c00;
        }

        @media (max-width: 768px) {
            .container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

    <header class="header">
        <h1>A CONTRALUZ</h1>
        <p>PANEL DE CONTROL EDITORIAL</p>
    </header>

    <div class="status-bar">
        <span>ESTADO: SESIÓN ACTIVA</span>
        <button class="btn-logout" id="logout-btn">CERRAR SESIÓN</button>
    </div>

    <div class="container">
        <!-- Formulario de Redacción -->
        <section class="panel">
            <h2>Redactar Noticia</h2>
            <form id="news-form">
                <div class="form-group">
                    <label for="fecha">FECHA DE PUBLICACIÓN</label>
                    <input type="date" id="fecha" name="fecha" required>
                </div>

                <div class="form-group">
                    <label for="seccion">SECCIÓN</label>
                    <select id="seccion" name="seccion" required>
                        <option value="Hoy">Hoy</option>
                        <option value="Opinión">Opinión</option>
                        <option value="Investigación">Investigación</option>
                        <option value="Cultura">Cultura</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="titulo">TÍTULO</label>
                    <input type="text" id="titulo" name="titulo" placeholder="Titular de la noticia..." required>
                </div>

                <div class="form-group">
                    <label for="resumen">RESUMEN / ENTRADILLA</label>
                    <input type="text" id="resumen" name="resumen" placeholder="Entradilla breve..." required>
                </div>

                <div class="form-group">
                    <label for="imagen">URL DE LA IMAGEN</label>
                    <input type="url" id="imagen" name="imagen" placeholder="https://...">
                </div>

                <div class="form-group">
                    <label for="cuerpo">CUERPO DE LA NOTICIA</label>
                    <textarea id="cuerpo" name="cuerpo" rows="8" placeholder="Escribe el artículo aquí..." required></textarea>
                </div>

                <button type="submit" class="btn-submit">PUBLICAR ARTÍCULO</button>
            </form>
        </section>

        <!-- Histórico de Artículos -->
        <section class="panel">
            <h2>Histórico de Artículos</h2>
            <div id="articles-list">
                <!-- Se puebla dinámicamente mediante JS -->
            </div>
        </section>
    </div>

    <!-- Modal de Vista Previa -->
    <div id="preview-modal" class="modal-overlay" style="display: none;">
        <div class="modal-content">
            <button type="button" class="close-btn" id="modal-close-btn">&times;</button>
            <div id="modal-body">
                <!-- Contenido dinámico del artículo -->
            </div>
        </div>
    </div>

    <!-- ENLACES AL SCRIPT CORREGIDOS A LA RAÍZ DEL SITIO -->
    <script src="/script.js"></script>
    <script src="../script.js"></script>
    
    <script>
        // Lógica de cierre del modal
        const modal = document.getElementById('preview-modal');
        const closeBtn = document.getElementById('modal-close-btn');

        if (closeBtn) {
            closeBtn.addEventListener('click', function() {
                modal.style.display = 'none';
            });
        }

        window.addEventListener('click', function(event) {
            if (event.target === modal) {
                modal.style.display = 'none';
            }
        });
    </script>
</body>
</html>
