<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>A Contraluz | Periodismo Independiente</title>
  <style>
    * { box-sizing: border-box; }
    body { background-color: #ffffff; color: #111111; font-family: Georgia, serif; margin: 0; padding: 0; }
    header { text-align: center; padding: 40px 20px 20px 20px; border-bottom: 3px double #111; }
    header h1 { font-size: 3rem; font-weight: 900; letter-spacing: 2px; margin: 0; text-transform: uppercase; }
    header p { font-style: italic; color: #555; margin-top: 5px; font-size: 1.1rem; }
    nav { display: flex; justify-content: center; gap: 10px; margin: 20px 0; border-bottom: 1px solid #ccc; padding-bottom: 15px; }
    nav button { background: none; border: 1px solid #ccc; padding: 8px 16px; cursor: pointer; font-weight: bold; text-transform: uppercase; font-size: 0.8rem; letter-spacing: 1px; }
    nav button.active { background: #cc0000; color: #fff; border-color: #cc0000; }
    main { max-width: 1000px; margin: 0 auto; padding: 20px; }
    .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
    .news-card { border-bottom: 1px solid #eee; padding-bottom: 20px; cursor: pointer; transition: transform 0.2s; }
    .news-card:hover { transform: translateY(-3px); }
    .news-card img { width: 100%; height: 200px; object-fit: cover; background: #eee; margin-bottom: 10px; }
    .category-tag { color: #cc0000; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; font-family: system-ui; }
    .news-card h2 { font-size: 1.4rem; margin: 8px 0; line-height: 1.2; }
    .news-card p { font-size: 0.95rem; color: #444; line-height: 1.5; }
    .news-card .date { font-size: 0.75rem; color: #888; font-family: system-ui; }
    .read-more { display: inline-block; margin-top: 10px; color: #cc0000; font-family: system-ui; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; }
    
    /* MODAL LECTURA COMPLETA */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); display: flex; justify-content: center; align-items: center; padding: 20px; z-index: 1000; }
    .modal-content { background: #fff; max-width: 800px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 30px; position: relative; border-top: 5px solid #cc0000; }
    .modal-close { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; background: none; border: none; cursor: pointer; font-weight: bold; color: #333; }
    .modal-body { line-height: 1.8; font-size: 1.1rem; color: #222; margin-top: 20px; white-space: pre-line; }
    .hidden { display: none !important; }
    footer { text-align: center; padding: 30px; border-top: 1px solid #eee; color: #777; font-size: 0.85rem; font-family: system-ui; margin-top: 40px; }
  </style>
</head>
<body>

  <header>
    <h1>A CONTRALUZ</h1>
    <p>Periodismo independiente, historias sin filtro</p>
  </header>

  <nav id="categories">
    <button class="active" data-cat="todas">Todas</button>
    <button data-cat="hoy">Hoy</button>
    <button data-cat="opinion">Opiniones</button>
    <button data-cat="cultura">Cultura</button>
    <button data-cat="deportes">Deportes</button>
  </nav>

  <main>
    <div id="news-container" class="news-grid">Cargando noticias...</div>
  </main>

  <!-- MODAL DE LECTURA -->
  <div id="read-modal" class="modal-overlay hidden">
    <div class="modal-content">
      <button class="modal-close" onclick="closeArticle()">&times;</button>
      <span id="m-category" class="category-tag"></span>
      <h1 id="m-title" style="font-size: 2.2rem; margin: 10px 0;"></h1>
      <p id="m-date" class="date" style="margin-bottom: 20px;"></p>
      <div id="m-image-container"></div>
      <p id="m-summary" style="font-style: italic; font-size: 1.1rem; color: #555; border-left: 3px solid #cc0000; padding-left: 15px; margin: 20px 0;"></p>
      <div id="m-body" class="modal-body"></div>
    </div>
  </div>

  <footer>
    © 2026 A Contraluz. Todos los derechos reservados.
  </footer>

  <script>
    const REPO_OWNER = "nik09091312";
    const REPO_NAME = "el-oraculo";
    const DEFAULT_BRANCH = "main";

    let allArticles = [];

    async function fetchArticles() {
      const container = document.getElementById('news-container');
      try {
        const res = await fetch(`https://api.github.com/repos/${REPO_OWNER}/${REPO_NAME}/contents/articulos?ref=${DEFAULT_BRANCH}`);
        if (!res.ok) {
          container.innerHTML = "<p style='text-align:center; width:100%;'>No hay noticias en esta sección.</p>";
          return;
        }

        const files = await res.json();
        const mdFiles = files.filter(f => f.name.endsWith('.md'));

        if (mdFiles.length === 0) {
          container.innerHTML = "<p style='text-align:center; width:100%;'>No hay noticias en esta sección.</p>";
          return;
        }

        allArticles = await Promise.all(mdFiles.map(async file => {
          const fileRes = await fetch(file.download_url);
          const rawText = await fileRes.text();
          return { ...parseMarkdown(rawText), filename: file.name };
        }));

        renderArticles('todas');
      } catch (e) {
        container.innerHTML = "<p style='text-align:center; width:100%;'>Error al cargar las noticias.</p>";
      }
    }

    function parseMarkdown(text) {
      const frontMatterMatch = text.match(/^---\n([\s\S]*?)\n---\n([\s\S]*)$/);
      if (!frontMatterMatch) return { title: 'Sin título', body: text };

      const yaml = frontMatterMatch[1];
      const body = frontMatterMatch[2];
      const metadata = {};

      yaml.split('\n').forEach(line => {
        const [key, ...value] = line.split(':');
        if (key && value) {
          metadata[key.trim()] = value.join(':').trim().replace(/^"|"$/g, '');
        }
      });

      return { ...metadata, body };
    }

    function renderArticles(filterCategory) {
      const container = document.getElementById('news-container');
      container.innerHTML = '';

      const filtered = filterCategory === 'todas' 
        ? allArticles 
        : allArticles.filter(a => (a.category || '').toLowerCase() === filterCategory.toLowerCase());

      if (filtered.length === 0) {
        container.innerHTML = "<p style='text-align:center; grid-column: 1 / -1;'>No hay noticias en esta sección.</p>";
        return;
      }

      filtered.forEach((art, index) => {
        const card = document.createElement('article');
        card.className = 'news-card';
        card.onclick = () => openArticle(art);
        card.innerHTML = `
          ${art.image ? `<img src="${art.image}" alt="${art.title}">` : ''}
          <span class="category-tag">${art.category || 'Noticia'}</span>
          <h2>${art.title || 'Sin Título'}</h2>
          <p>${art.summary || art.body.substring(0, 120) + '...'}</p>
          <span class="date">${art.date ? new Date(art.date).toLocaleDateString() : ''}</span>
          <div><span class="read-more">Leer artículo completo &rarr;</span></div>
        `;
        container.appendChild(card);
      });
    }

    function openArticle(art) {
      document.getElementById('m-category').textContent = art.category || 'Noticia';
      document.getElementById('m-title').textContent = art.title || 'Sin Título';
      document.getElementById('m-date').textContent = art.date ? new Date(art.date).toLocaleDateString() : '';
      document.getElementById('m-summary').textContent = art.summary || '';
      document.getElementById('m-body').textContent = art.body || '';

      const imgContainer = document.getElementById('m-image-container');
      if (art.image) {
        imgContainer.innerHTML = `<img src="${art.image}" style="width:100%; max-height:400px; object-fit:cover; margin-bottom:20px;">`;
      } else {
        imgContainer.innerHTML = '';
      }

      document.getElementById('read-modal').classList.remove('hidden');
    }

    function closeArticle() {
      document.getElementById('read-modal').classList.add('hidden');
    }

    document.querySelectorAll('#categories button').forEach(btn => {
      btn.addEventListener('click', (e) => {
        document.querySelectorAll('#categories button').forEach(b => b.classList.remove('active'));
        e.target.classList.add('active');
        renderArticles(e.target.getAttribute('data-cat'));
      });
    });

    fetchArticles();
  </script>
</body>
</html>
