<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Contraluz - Periodico Digital</title>
    <link rel="stylesheet" href="style.css">
    <!-- Cargar Netlify Identity widget para la administración -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
</head>
<body>

    <header>
        <div class="header-container">
            <h1>A CONTRALUZ</h1>
            <p class="tagline">Periodismo independiente, historias sin filtro</p>
        </div>
    </header>

    <main class="main-content">
        <section class="articles-container" id="articles-list">
            <!-- Los artículos publicados desde Decap CMS / Netlify CMS se cargarán aquí dinámicamente -->
            <article class="featured-article">
                <h2>Cargando noticias principales...</h2>
                <p>Las últimas publicaciones aparecerán en este espacio.</p>
            </article>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 A Contraluz. Todos los derechos reservados.</p>
    </footer>

    <script>
        if (window.netlifyIdentity) {
            window.netlifyIdentity.on("init", user => {
                if (!user) {
                    window.netlifyIdentity.on("login", () => {
                        document.location.href = "/admin/";
                    });
                }
            });
        }
    </script>
</body>
</html>
