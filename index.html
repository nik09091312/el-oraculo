<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>A Contraluz | La verdad en tiempos de ruido</title>
  <style>
    :root {
      --bg-color: #f7f7f7;
      --card-bg: #ffffff;
      --text-color: #1a1a1a;
      --text-muted: #555555;
      --accent: #b30000;
      --border-color: #e0e0e0;
      --header-bg: #0f0f0f;
      --header-text: #ffffff;
    }

    [data-theme="dark"] {
      --bg-color: #121212;
      --card-bg: #1e1e1e;
      --text-color: #f0f0f0;
      --text-muted: #aaaaaa;
      --accent: #ff4d4d;
      --border-color: #333333;
      --header-bg: #000000;
      --header-text: #ffffff;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Georgia', serif; background-color: var(--bg-color); color: var(--text-color); transition: background-color 0.3s, color 0.3s; }

    header { background-color: var(--header-bg); color: var(--header-text); text-align: center; padding: 35px 20px 20px; position: relative; border-bottom: 4px solid var(--accent); }
    header h1 { font-size: 3rem; letter-spacing: 3px; text-transform: uppercase; margin-bottom: 5px; font-weight: 900; }
    header p { font-size: 0.95rem; font-style: italic; color: #ccc; }

    .theme-toggle { position: absolute; top: 15px; right: 20px; background: transparent; border: 1px solid #666; color: #fff; padding: 6px 12px; font-size: 0.8rem; cursor: pointer; border-radius: 4px; }
    .theme-toggle:hover { background: rgba(255,255,255,0.1); }

    nav { display: flex; justify-content: center; gap: 25px; padding: 15px; background: var(--card-bg); border-bottom: 1px solid var(--border-color); font-family: sans-serif; font-weight: bold; text-transform: uppercase; font-size: 0.85rem; }
    nav button { background: none; border: none; color: var(--text-color); cursor: pointer; padding: 5px 10px; font-family: inherit; font-size: inherit; font-weight: inherit; }
    nav button.active { color: var(--accent); border-bottom: 2px solid var(--accent); }

    .container { max-width: 1200px; margin: 30px auto; padding: 0 20px; display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 25px; }

    .card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 25px; border-radius: 4px; display: flex; flex-direction: column; justify-content: space-between; transition: transform 0.2s, box-shadow 0.2s; cursor: pointer; }
    .card:hover { transform: translateY(-3px); box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
    .category { color: var(--accent); font-family: sans-serif; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 1px; }
    .card h2 { font-size: 1.4rem; margin-bottom: 12px; line-height: 1.3; }
    .card p { font-size: 0.95rem; color: var(--text-muted); line-height: 1.5; margin-bottom: 20px; }
    .read-more { color: var(--accent); font-family: sans-serif; font-size: 0.85rem; font-weight: bold; text-decoration: none; align-self: flex-start; }

    .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; padding: 20px; }
    .modal-content { background: var(--card-bg); color: var(--text-color); max-width: 700px; width: 100%; max-height: 85vh; overflow-y: auto; padding: 35px; border-radius: 6px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    .close-modal { position: absolute; top: 15px; right: 20px; font-size: 1.8rem; background: none; border: none; color: var(--text-color); cursor: pointer; }
    .modal-category { color: var(--accent); font-family: sans-serif; font-size: 0.8rem; font-weight: bold; text-transform: uppercase; margin-bottom: 8px; }
    .modal-title { font-size: 2rem; margin-bottom: 15px; line-height: 1.2; }
    .modal-body { font-size: 1.05rem; line-height: 1.7; color: var(--text-color); margin-top: 20px; }
  </style>
</head>
<body>

  <header>
    <button class="theme-toggle" onclick="toggleTheme()">Cambiar Tema</button>
    <h1>A Contraluz</h1>
    <p>La verdad en tiempos de ruido | Edición Digital</p>
  </header>

  <nav class="categories-nav">
    <button class="nav-btn active" onclick="filterCategory('TODAS', this)">Todas</button>
    <button class="nav-btn" onclick="filterCategory('ACTUALIDAD', this)">Actualidad</button>
    <button class="nav-btn" onclick="filterCategory('HISTORIA', this)">Historia</button>
    <button class="nav-btn" onclick="filterCategory('CULTURA', this)">Cultura</button>
    <button class="nav-btn" onclick="filterCategory('OPINIÓN', this)">Opinión</button>
  </nav>

  <main class="container" id="news-container">
    <p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-family: sans-serif;">Cargando artículos...</p>
  </main>

  <div class="modal" id="article-modal" onclick="closeModalOnOuterClick(event)">
    <div class="modal-content">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <div class="modal-category" id="modal-cat"></div>
      <h2 class="modal-title" id="modal-title"></h2>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <script>
    const GITHUB_USER = "nik09091312";
    let allArticles = [];
    const container = document.getElementById('news-container');

    function normalizeText(str) {
      return (str || '')
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .toUpperCase()
        .trim();
    }

    function parseFrontmatter(text) {
      const result = { attributes: {}, body: '' };
      const lines = text.split('\n');
      if (lines[0].trim() === '---') {
        let i = 1;
        while (i < lines.length && lines[i].trim() !== '---') {
          const line = lines[i];
          const colonIdx = line.indexOf(':');
          if (colonIdx !== -1) {
            const key = line.slice(0, colonIdx).trim().toLowerCase();
            let value = line.slice(colonIdx + 1).trim();
            if ((value.startsWith('"') && value.endsWith('"')) || (value.startsWith("'") && value.endsWith("'"))) {
              value = value.slice(1, -1);
            }
            result.attributes[key] = value;
          }
          i++;
        }
        result.body = lines.slice(i + 1).join('\n').trim();
      } else {
        result.body = text;
      }
      return result;
    }

    async function fetchDirectory(repo, path) {
      const ts = new Date().getTime();
      const url = `https://api.github.com/repos/${GITHUB_USER}/${repo}/contents/${path}?t=${ts}`;
      const res = await fetch(url);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return await res.json();
    }

    async function loadCMSArticles() {
      try {
        let files = null;
        const attempts = [
          { repo: "el-or%C3%A1culo", path: "contenido/%20art%C3%ADculos" },
          { repo: "el-oraculo", path: "contenido/articulos" },
          { repo: "el-oraculo", path: "content/articulos" }
        ];

        for (const attempt of attempts) {
          try {
            files = await fetchDirectory(attempt.repo, attempt.path);
            if (files && Array.isArray(files)) break;
          } catch (e) {}
        }

        if (!files || !Array.isArray(files)) {
          throw new Error("No se pudo localizar la carpeta de artículos.");
        }

        const loaded = [];
        const ts = new Date().getTime();

        for (const file of files) {
          if (file.name && file.name.endsWith('.md')) {
            try {
              const res = await fetch(`${file.download_url}?t=${ts}`);
              const text = await res.text();
              const parsed = parseFrontmatter(text);
              const attrs = parsed.attributes;

              const title = attrs.title || attrs['título'] || attrs.titulo || 'Sin título';
              const category = attrs.category || attrs['categoría'] || attrs.categoria || 'ACTUALIDAD';
              const excerpt = attrs.excerpt || attrs['subtítulo / extracto'] || attrs.subtitulo || parsed.body.slice(0, 150) + '...';

              loaded.push({
                title: title,
                category: category,
                excerpt: excerpt,
                content: parsed.body.replace(/\n/g, '<br>'),
                date: attrs.date || ''
              });
            } catch (errFile) {
              console.warn("Error leyendo archivo:", file.name, errFile);
            }
          }
        }

        allArticles = loaded.reverse();
        renderArticles(allArticles);
      } catch (err) {
        console.warn(err);
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-family: sans-serif;">Aún no hay publicaciones creadas o está cargando los datos...</p>';
      }
    }

    function renderArticles(list) {
      container.innerHTML = '';
      if (list.length === 0) {
        container.innerHTML = '<p style="grid-column: 1/-1; text-align: center; color: var(--text-muted); font-family: sans-serif;">No hay artículos en esta categoría.</p>';
        return;
      }
      list.forEach(item => {
        const card = document.createElement('article');
        card.className = 'card';
        card.onclick = () => openModal(item);
        card.innerHTML = `
          <div>
            <div class="category">${item.category}</div>
            <h2>${item.title}</h2>
            <p>${item.excerpt}</p>
          </div>
          <span class="read-more">Leer artículo completo &rarr;</span>
        `;
        container.appendChild(card);
      });
    }

    function filterCategory(categoryName, element) {
      document.querySelectorAll('.categories-nav button, nav button').forEach(btn => btn.classList.remove('active'));
      if (element) element.classList.add('active');

      const selectedNorm = normalizeText(categoryName);

      if (selectedNorm === 'TODAS' || selectedNorm === 'TODOS') {
        renderArticles(allArticles);
      } else {
        const filtered = allArticles.filter(art => normalizeText(art.category) === selectedNorm);
        renderArticles(filtered);
      }
    }

    function openModal(article) {
      document.getElementById('modal-cat').innerText = article.category;
      document.getElementById('modal-title').innerText = article.title;
      document.getElementById('modal-body').innerHTML = article.content;
      document.getElementById('article-modal').style.display = 'flex';
    }

    function closeModal() {
      document.getElementById('article-modal').style.display = 'none';
    }

    function closeModalOnOuterClick(e) {
      if (e.target.id === 'article-modal') closeModal();
    }

    function toggleTheme() {
      const current = document.body.getAttribute('data-theme');
      if (current === 'dark') {
        document.body.removeAttribute('data-theme');
      } else {
        document.body.setAttribute('data-theme', 'dark');
      }
    }

    loadCMSArticles();
  </script>
</body>
</html>
